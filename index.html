<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Owner Aggregator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; margin-bottom: 16px; color: #e94560; font-size: 1.3rem; }
  .container { max-width: 900px; margin: 0 auto; }
  .api-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .api-row > div { flex: 1; }
  .api-row label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #aaa; }
  .api-row input {
    width: 100%; background: #16213e; border: 1px solid #333; color: #eee;
    border-radius: 6px; padding: 7px 10px; font-size: 0.85rem;
  }
  .api-row input:focus { outline: none; border-color: #e94560; }
  .pair-row { display: flex; gap: 10px; align-items: start; margin-bottom: 8px; }
  .pair-row textarea {
    flex: 1; height: 60px; background: #16213e; border: 1px solid #333; color: #eee;
    border-radius: 6px; padding: 8px; font-family: monospace; font-size: 0.85rem; resize: vertical;
  }
  .pair-row textarea:focus { outline: none; border-color: #e94560; }
  .pair-row input {
    width: 100px; background: #16213e; border: 1px solid #333; color: #eee;
    border-radius: 6px; padding: 8px; font-family: monospace; font-size: 0.85rem; text-align: center;
  }
  .pair-row input:focus { outline: none; border-color: #e94560; }
  .remove-btn {
    background: none; border: none; color: #e94560; font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
  }
  .remove-btn:hover { color: #ff6b6b; }
  .pairs-header { display: flex; gap: 10px; margin-bottom: 6px; font-size: 0.8rem; color: #aaa; }
  .pairs-header span:first-child { flex: 1; }
  .pairs-header span:nth-child(2) { width: 100px; text-align: center; }
  .pairs-header span:nth-child(3) { width: 30px; }
  .btn {
    background: #e94560; color: #fff; border: none; border-radius: 6px; padding: 8px 22px;
    font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #c73650; }
  .btn:disabled { background: #555; cursor: not-allowed; }
  .btn-add {
    background: #0f3460; color: #eee; border: none; border-radius: 6px; padding: 6px 16px;
    font-size: 0.8rem; cursor: pointer; margin-bottom: 12px;
  }
  .btn-add:hover { background: #1a4a8a; }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  .progress { margin: 8px 0; font-size: 0.85rem; color: #aaa; min-height: 18px; }
  .result-section {
    background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 14px; margin-top: 8px;
    min-height: 60px; position: relative;
  }
  .result-section h2 { font-size: 0.95rem; color: #e94560; margin-bottom: 8px; }
  .result-list { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 350px; overflow-y: auto; }
  .copy-btn {
    position: absolute; top: 12px; right: 12px; background: #0f3460; color: #eee; border: none;
    border-radius: 6px; padding: 5px 14px; font-size: 0.75rem; cursor: pointer;
  }
  .copy-btn:hover { background: #1a4a8a; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<div class="container">
  <h1>NFT Owner Aggregator</h1>
  <div class="api-row">
    <div>
      <label>Contract Address</label>
      <input id="contract" value="yuplandshop.mintbase1.near" />
    </div>
    <div>
      <label>API Key</label>
      <input id="apikey" value="j9mwYHIkRsmhM7dOoJy9yBSEdSZSWtBw02BOIGy3jzk" />
    </div>
  </div>
  <div class="pairs-header">
    <span>Token IDs (через пробел, запятую, перенос)</span>
    <span>Значение</span>
    <span></span>
  </div>
  <div id="pairs"></div>
  <div class="actions">
    <button class="btn-add" onclick="addPair()">+ Добавить строку</button>
    <button class="btn" id="runBtn" onclick="run()">Запустить</button>
  </div>
  <div class="progress" id="progress"></div>
  <div class="result-section">
    <h2>Результат: owner_id, сумма</h2>
    <button class="copy-btn" onclick="copyResult()">Копировать</button>
    <div class="result-list" id="result"></div>
  </div>
</div>
<script>
const BATCH = 500;
const pairsEl = document.getElementById('pairs');

function addPair() {
  const row = document.createElement('div');
  row.className = 'pair-row';
  row.innerHTML = '<textarea placeholder="139656 139698 139590..."></textarea><input type="number" placeholder="100" /><button class="remove-btn" onclick="this.parentElement.remove()" title="Удалить">×</button>';
  pairsEl.appendChild(row);
}
addPair();

function collectPairs() {
  const rows = pairsEl.querySelectorAll('.pair-row');
  const all = [];
  for (const row of rows) {
    const ids = row.querySelector('textarea').value.trim().split(/[\s,]+/).filter(Boolean);
    const val = parseFloat(row.querySelector('input').value);
    if (!ids.length) continue;
    if (isNaN(val)) return { error: 'Все значения должны быть числами' };
    for (const id of ids) all.push({ tokenId: id, value: val });
  }
  return { pairs: all };
}

async function fetchBatch(contract, apikey, ids) {
  const res = await fetch('/api/nft', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contract, apikey, token_ids: ids })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

async function run() {
  const contract = document.getElementById('contract').value.trim();
  const apikey = document.getElementById('apikey').value.trim();
  const progress = document.getElementById('progress');
  const result = document.getElementById('result');
  const btn = document.getElementById('runBtn');

  const { pairs, error } = collectPairs();
  if (error) { progress.innerHTML = '<span class="error">' + error + '</span>'; return; }
  if (!pairs.length) { progress.innerHTML = '<span class="error">Нет данных</span>'; return; }

  btn.disabled = true;
  result.textContent = '';
  const ownerMap = {};
  let done = 0;

  for (let i = 0; i < pairs.length; i += BATCH) {
    const batch = pairs.slice(i, i + BATCH);
    const ids = batch.map(b => b.tokenId);
    progress.textContent = 'Загрузка ' + Math.min(i + BATCH, pairs.length) + ' / ' + pairs.length + '...';
    try {
      const data = await fetchBatch(contract, apikey, ids);
      for (const item of data.items) {
        const pair = batch.find(b => b.tokenId === item.token_id);
        if (!pair) continue;
        ownerMap[item.owner_id] = (ownerMap[item.owner_id] || 0) + pair.value;
      }
      done += batch.length;
    } catch (e) {
      progress.innerHTML = '<span class="error">Ошибка: ' + e.message + '</span>';
      btn.disabled = false;
      return;
    }
  }

  const lines = Object.entries(ownerMap)
    .sort((a, b) => b[1] - a[1])
    .map(([owner, sum]) => owner + ',' + sum)
    .join('\n');

  result.textContent = lines;
  progress.textContent = 'Готово. ' + done + ' токенов, ' + Object.keys(ownerMap).length + ' владельцев.';
  btn.disabled = false;
}

function copyResult() {
  const text = document.getElementById('result').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const b = document.querySelector('.copy-btn');
    b.textContent = 'Скопировано!';
    setTimeout(() => b.textContent = 'Копировать', 1500);
  });
}
</script>
</body>
</html>
